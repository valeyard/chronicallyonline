name: Daily scrape and deploy
# (Re-touched so GitHub registers this workflow_dispatch/schedule-only
# workflow — a merge commit alone didn't trigger discovery.)

on:
  schedule:
    # 05:00 UTC = after midnight in both GMT and BST, so "yesterday" (the
    # default date the scraper computes) is always a complete UK day.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Scrape yesterday's posts
        run: node scraper/scrape.mjs
        env:
          AUTH_STORAGE_STATE_B64: ${{ secrets.AUTH_STORAGE_STATE_B64 }}

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update scrape data: $(git diff --cached --name-only | tr '\n' ' ')"
          git push

      - name: Build site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - uses: actions/deploy-pages@v4
        id: deployment
