name: Historical backfill

on:
  workflow_dispatch:
    inputs:
      andy_burnham:
        description: "Andy Burnham (Labour)"
        type: boolean
        default: true
      kemi_badenoch:
        description: "Kemi Badenoch (Conservative)"
        type: boolean
        default: true
      ed_davey:
        description: "Ed Davey (Liberal Democrats)"
        type: boolean
        default: true
      nigel_farage:
        description: "Nigel Farage (Reform UK)"
        type: boolean
        default: true
      zack_polanski:
        description: "Zack Polanski (Green)"
        type: boolean
        default: true
      dave_doogan:
        description: "Dave Doogan (SNP)"
        type: boolean
        default: true
      force:
        description: "Re-scrape days that already have data"
        type: boolean
        default: false
      since:
        description: "Start date, YYYY-MM-DD (blank defaults to 14 days before 'until')"
        type: string
        default: ""
      until:
        description: "End date, YYYY-MM-DD (blank defaults to yesterday)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backfill-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Backfill
        run: |
          ARGS=""
          if [ -n "${{ inputs.since }}" ]; then
            ARGS="--since=${{ inputs.since }}"
            if [ -n "${{ inputs.until }}" ]; then ARGS="$ARGS --until=${{ inputs.until }}"; fi
          fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi

          ONLY=""
          if [ "${{ inputs.andy_burnham }}" = "true" ]; then ONLY="$ONLY,andyburnham"; fi
          if [ "${{ inputs.kemi_badenoch }}" = "true" ]; then ONLY="$ONLY,KemiBadenoch"; fi
          if [ "${{ inputs.ed_davey }}" = "true" ]; then ONLY="$ONLY,EdwardJDavey"; fi
          if [ "${{ inputs.nigel_farage }}" = "true" ]; then ONLY="$ONLY,Nigel_Farage"; fi
          if [ "${{ inputs.zack_polanski }}" = "true" ]; then ONLY="$ONLY,ZackPolanski"; fi
          if [ "${{ inputs.dave_doogan }}" = "true" ]; then ONLY="$ONLY,DaveDooganSNP"; fi
          ONLY="${ONLY#,}"

          if [ -z "$ONLY" ]; then
            echo "No politicians selected — nothing to do."
            exit 1
          fi

          # Only pass --only when it's a strict subset — omitting it entirely
          # for "everyone selected" keeps behavior identical to no filter.
          SELECTED_COUNT=$(echo "$ONLY" | tr ',' '\n' | wc -l)
          if [ "$SELECTED_COUNT" -lt 6 ]; then
            ARGS="$ARGS --only=$ONLY"
          fi

          echo "Running: node scraper/backfill.mjs $ARGS"
          node scraper/backfill.mjs $ARGS
        env:
          AUTH_STORAGE_STATE_B64: ${{ secrets.AUTH_STORAGE_STATE_B64 }}
          DEBUG_SCRAPE_DIR: debug-artifacts

      - name: Upload debug screenshots/DOM dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: debug-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Backfill scrape data: $(git diff --cached --name-only | tr '\n' ' ')"
          git push

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - uses: actions/deploy-pages@v4
        id: deployment
